<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#6b3e26">
  <meta name="robots" content="noindex">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>لوحة المحل — نقاطك</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/img/nuqatak-logo.png">
  <meta name="apple-mobile-web-app-title" content="نقاطك">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="wrap">
      <img class="logo" id="shopLogo" alt="">
      <div class="title" id="shopName">…</div>
      <span class="small muted" id="userName"></span>
      <button class="btn ghost sm" id="logout" type="button">خروج</button>
    </div>
  </header>
  <nav class="tabs" id="tabs">
    <a href="#cashier" data-tab="cashier"><span>📷</span>الكاشير</a>
    <a href="#members" data-tab="members"><span>👥</span>الزبائن</a>
    <a href="#activity" data-tab="activity"><span>📊</span>النشاط</a>
    <a href="#join" data-tab="join"><span>🔗</span>الانضمام</a>
    <a href="#offers" data-tab="offers" class="owner-only hidden"><span>🎁</span>العروض</a>
    <a href="#settings" data-tab="settings" class="owner-only hidden"><span>⚙️</span>الإعدادات</a>
    <a href="#admin" data-tab="admin" class="admin-only hidden"><span>👑</span>المنصة</a>
  </nav>
  <div class="wrap hidden" id="subBanner"></div>
  <main class="wrap has-tabs" id="view"><p class="center muted" style="padding:60px 0">جاري التحميل…</p></main>
  <dialog id="dlg">
    <div class="dlg-head"><h3 id="dlgTitle"></h3><button class="btn ghost sm" id="dlgClose" type="button" aria-label="إغلاق">✕</button></div>
    <div class="dlg-body" id="dlgBody"></div>
  </dialog>
  <script src="/vendor/qrcode.js"></script>
  <script type="module" src="/js/app.js"></script>
</body>
</html>

# النشر على Cloudflare Workers (الخطة المجانية بتكفي للبداية)
# 1) npx wrangler d1 create loyalty   ← وانسخ database_id اللي بيطلع هون
# 2) npx wrangler secret put GOOGLE_SERVICE_ACCOUNT   ← الصق محتوى ملف JSON تبع حساب الخدمة
# 3) npx wrangler deploy
name = "loyalty"
main = "src/worker.js"
account_id = "65c5a1672b3de2c36a6e79273a99c43a"
compatibility_date = "2025-09-01"
workers_dev = true
preview_urls = false

[assets]
directory = "./public"
binding = "ASSETS"
# كل الطلبات بتمرّ على السيرفر أول (عشان روابط /j/... و /c/... ورؤوس الأمان)
run_worker_first = true
html_handling = "none"
not_found_handling = "none"

[[d1_databases]]
binding = "DB"
database_name = "loyalty"
database_id = "d9ec1b6e-14fb-4d36-8ae4-78bc7e01d46e"

[vars]
# العنوان الرسمي: كل الروابط (البطاقات، الـ QR، الإشعارات، المحافظ) بتطلع فيه، وصفحات العنوان القديم و www بتتحوّل عليه
PUBLIC_URL = "https://nuqatak.com"
# رقم المُصدِر من Google Pay & Wallet Console (مش سري)
GOOGLE_ISSUER_ID = "3388000000023212673"
# رقم واتساب للتواصل بصفحة البيع والخصوصية (مع مفتاح الدولة، بدون + أو صفر)
WHATSAPP_NUMBER = "962798900911"
# رقم تعريف رقم واتساب الإيجنت عند Meta (Phone number ID، مش سري). التوكن سري وبينحط بلوحة Cloudflare
WHATSAPP_PHONE_ID = "1330836546787669"
# الأسرار بتنحط من لوحة Cloudflare (Settings ← Variables and Secrets ← Secret)، مش هون:
#   GOOGLE_SERVICE_ACCOUNT = محتوى ملف JSON تبع حساب الخدمة
#   SIGNUP_CODE (اختياري) = رمز بتعطيه للمحلات عشان تقدر تسجّل؛ بدونه التسجيل مفتوح للكل
#   ANTHROPIC_API_KEY (اختياري) = مفتاح Anthropic لوكيل المبيعات؛ بدونه الوكيل مطفي
#   WHATSAPP_TOKEN و WHATSAPP_PHONE_ID و WHATSAPP_APP_SECRET و WHATSAPP_VERIFY_TOKEN (اختياري) = واتساب الرسمي لوكيل المبيعات
# اختياري للوكيل (متغيرات عادية): AI_MODEL، AI_VISITOR_DAILY (30)، AI_DAILY_LIMIT (600)، WHATSAPP_TEMPLATE (nuqatak_intro)، WHATSAPP_TEMPLATE_LANG (ar)، WHATSAPP_API_VERSION (v26.0)

# سجلّ الأخطاء (بيبيّن بـ Cloudflare ← Workers ← loyalty ← Logs)
[observability]
enabled = true

# مهام دورية كل 5 دقايق: هدايا عيد الميلاد، طلب التقييم بعد الزيارة، وتذكير الزبائن الغايبين
[triggers]
crons = ["*/5 * * * *"]

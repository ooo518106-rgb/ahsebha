<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الصفحة غير موجودة — احسبها</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📒</text></svg>">
<style>
  :root { color-scheme: light dark; }
  body { font-family: 'Cairo', system-ui, sans-serif; margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; box-sizing: border-box; background: #f8fafc; color: #1e293b; text-align: center; }
  @media (prefers-color-scheme: dark) { body { background: #0f172a; color: #f1f5f9; } }
  h1 { font-size: 1.4rem; margin: 12px 0 8px; }
  p { color: #64748b; line-height: 1.8; margin: 0 0 18px; }
  a { display: inline-block; background: linear-gradient(135deg, #4f46e5, #ec4899); color: #fff; font-weight: 800; padding: 12px 22px; border-radius: 999px; text-decoration: none; }
</style>
</head>
<body>
<main>
  <div style="font-size:3rem">📒</div>
  <h1>هذه الصفحة لم تعد موجودة</h1>
  <p>احسبها صار برنامج محاسبة متكامل ومجاني: فواتير ضريبية، مخزون، قيود وتقارير.</p>
  <a id="home" href="/ahsebha/">افتح برنامج المحاسبة ←</a>
</main>
<script>
  // الموقع منشور تحت /ahsebha/ على GitHub Pages؛ نحوّل الزائر للبرنامج بعد لحظات
  var base = location.pathname.indexOf('/ahsebha/') === 0 ? '/ahsebha/' : '/';
  document.getElementById('home').href = base;
  setTimeout(function () { location.replace(base); }, 4000);
</script>
</body>
</html>
